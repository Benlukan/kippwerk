name: Supabase wach halten

# Supabase Free pausiert Projekte nach 7 Tagen ohne Aktivität.
# Dieser Workflow ruft alle 3 Tage die Online-Bestenliste ab und hält das Projekt so aktiv.
# URL + Key werden aus www/index.html (ONLINE_CONFIG) gelesen – keine Secrets nötig.

on:
  schedule:
    - cron: '17 4 */3 * *'   # alle 3 Tage, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Online-Bestenliste anpingen
        run: |
          line=$(grep -o "const ONLINE_CONFIG={[^}]*}" www/index.html || true)
          url=$(echo "$line" | sed -n "s/.*url:'\([^']*\)'.*/\1/p")
          key=$(echo "$line" | sed -n "s/.*key:'\([^']*\)'.*/\1/p")
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "ONLINE_CONFIG ist noch leer – nichts zu tun."
            exit 0
          fi
          auth=()
          case "$key" in eyJ*) auth=(-H "Authorization: Bearer $key");; esac
          code=$(curl -s -o resp.txt -w '%{http_code}' --max-time 30 -X POST "${url%/}/rest/v1/rpc/kw_top" \
            -H "apikey: $key" "${auth[@]}" -H 'Content-Type: application/json' \
            -d '{"p_mode":"endless","p_size":6,"p_limit":1}')
          echo "HTTP $code"; head -c 300 resp.txt; echo
          if [ "$code" != "200" ]; then
            echo "::error::Supabase antwortet nicht (HTTP $code). Projekt evtl. pausiert: Supabase-Dashboard → Projekt → Resume project."
            exit 1
          fi

      - name: Zeitplan aktiv halten
        # GitHub schaltet geplante Workflows nach 60 Tagen ohne Repo-Aktivität ab – erneutes Aktivieren setzt das zurück.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"

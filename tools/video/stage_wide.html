<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<style>
@font-face{font-family:SG;font-weight:500;src:url(/kippwerk/www/fonts/space-grotesk-latin-500-normal.woff2)}
@font-face{font-family:SG;font-weight:700;src:url(/kippwerk/www/fonts/space-grotesk-latin-700-normal.woff2)}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0d0f1a;font-family:SG,sans-serif;color:#e9ecff}
#bg{position:absolute;inset:0;background:radial-gradient(1300px 900px at 30% 30%,#262c58 0%,#0d0f1a 65%)}
.deco{position:absolute;width:120px;height:120px;border-radius:26px;opacity:.10;animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(40px,-70px) rotate(25deg)}}
.cap{position:absolute;left:0;right:0;top:96px;text-align:center;transition:opacity .35s,transform .35s}
.cap.out{opacity:0;transform:translateY(-14px)}
.cap h1{margin:0;font-size:66px;font-weight:700;letter-spacing:.01em;line-height:1.08}
.cap h1 em{font-style:normal;color:#4cc9f0}
.cap p{margin:14px 0 0;font-size:34px;color:#aab0d8;font-weight:500}
.phone{position:absolute;left:50%;top:340px;width:709px;height:1452px;margin-left:-372px;border:18px solid #1c2140;border-radius:72px;overflow:hidden;
  box-shadow:0 0 0 3px #343b66,0 40px 120px #000c,0 0 90px #4cc9f022;background:#0d0f1a;transition:transform .5s,opacity .4s}
.phone iframe{width:412px;height:844px;border:0;transform:scale(1.7209);transform-origin:0 0;position:absolute;left:0;top:0}
.phone img{position:absolute;left:0;top:0;width:709px;height:1452px;opacity:0;transition:opacity .45s}
.phone img.on{opacity:1}
.arrow{position:absolute;left:50%;top:54%;width:170px;height:170px;margin:-85px 0 0 -85px;border-radius:50%;background:#ffffff1f;border:4px solid #ffffff66;
  display:grid;place-items:center;font-size:96px;color:#fff;opacity:0;pointer-events:none}
.arrow.go{animation:swipe .55s ease-out}
@keyframes swipe{0%{opacity:0;transform:translate(0,0) scale(.7)}30%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1)}}
.full{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;opacity:0;transition:opacity .4s}
.full.on{opacity:1}
.logo{position:relative;width:300px;height:300px;transform:rotate(-12deg)}
.lt{position:absolute;width:136px;height:136px;border-radius:30px;box-shadow:inset 0 -9px 0 #0003,inset 0 4px 0 #fff5,0 0 40px var(--c);background:var(--c);opacity:0;display:grid;place-items:center;font-size:44px;color:#0006}
.kfly{position:absolute;left:50%;top:50%;width:170px;height:154px;margin:-330px 0 0 40px;opacity:0;z-index:5;filter:drop-shadow(0 10px 14px #000a)}
.kfly svg{width:100%;height:100%;overflow:visible}.kfly .wing{fill:#cfefff;fill-opacity:.6;stroke:#e9f8ff;stroke-width:1;transform-box:fill-box;transform-origin:50% 100%}
.kfly .lid{display:none}
.kfly.in{animation:kin 1.1s cubic-bezier(.2,.8,.3,1) forwards}.kfly.in .wing{animation:kw .07s linear 15 alternate}
.kfly.sit{opacity:1;transform:none}
@keyframes kin{0%{opacity:1;transform:translate(560px,-420px) rotate(25deg)}60%{transform:translate(-40px,30px) rotate(-8deg)}100%{opacity:1;transform:none}}
@keyframes kw{to{transform:scaleY(.25)}}
.lt.in{animation:drop .55s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes drop{from{opacity:0;transform:translateY(-260px)}to{opacity:1;transform:none}}
.word{font-size:132px;font-weight:700;letter-spacing:.16em;opacity:0;transform:scale(.85);transition:opacity .5s,transform .6s cubic-bezier(.3,1.4,.5,1)}
.word span{color:#4cc9f0}.word.on{opacity:1;transform:none}
.tag{font-size:44px;color:#c3c8ea;opacity:0;transition:opacity .5s}.tag.on{opacity:1}
.cta{font-size:56px;font-weight:700;padding:26px 60px;border-radius:30px;background:#4cc9f0;color:#06121a;opacity:0;transform:translateY(20px);transition:opacity .5s,transform .5s}
.cta.on{opacity:1;transform:none}
.small{font-size:34px;color:#8a90b8;opacity:0;transition:opacity .5s}.small.on{opacity:1}
#fade{position:absolute;inset:0;background:#0d0f1a;opacity:1;transition:opacity .25s;pointer-events:none}
#fade.off{opacity:0}

/* Querformat 1920×1080: Text links, Handy rechts */
.cap{left:130px;right:auto;width:900px;top:50%;text-align:left;transform:translateY(-50%)}
.cap.out{opacity:0;transform:translateY(calc(-50% - 14px))}
.cap h1{font-size:92px;line-height:1.06}.cap p{font-size:40px;margin-top:26px;line-height:1.3}
.step{position:absolute;left:134px;top:150px;font-size:26px;letter-spacing:.22em;color:#7f87bd;font-weight:700;text-transform:uppercase;transition:opacity .35s}
.phone{left:auto;right:170px;top:46px;margin:0;width:465px;height:952px;border-width:14px;border-radius:56px}
.phone iframe{width:412px;height:844px;transform:scale(1.1286)}
.arrow{width:130px;height:130px;margin:-65px 0 0 -65px;font-size:72px}
.full{gap:26px}
.logo{transform:rotate(-12deg) scale(.85)}
.word{font-size:150px}.tag{font-size:46px}.cta{font-size:58px}.small{font-size:34px}
</style></head><body>
<div id="bg"></div>
<div id="decos"></div>
<div class="step" id="step"></div>
<div class="cap out" id="cap"><h1 id="capH"></h1><p id="capP"></p></div>
<div class="phone" id="phone" style="opacity:0">
  <iframe id="game"></iframe>
  <div class="arrow" id="arrow">➜</div>
</div>
<div class="full" id="full">
  <div class="logo" id="logo">
    <div class="lt" style="--c:#ff5d73;left:0;top:0">●</div><div class="lt" style="--c:#ffc145;left:156px;top:0">▲</div>
    <div class="lt" style="--c:#3ddc97;left:0;top:156px">■</div><div class="lt" style="--c:#4cc9f0;left:156px;top:156px">◆</div>
  </div>
  <div class="kfly" id="kfly"><svg viewBox="0 0 64 58"><g>
        <ellipse class="wing" cx="21" cy="17" rx="13" ry="8" transform="rotate(-28 21 17)"/><ellipse class="wing" cx="43" cy="17" rx="13" ry="8" transform="rotate(28 43 17)"/>
        <g stroke="#141831" stroke-width="2.4" stroke-linecap="round" fill="none"><path d="M24 46l-5 8"/><path d="M30 48l-2 8"/><path d="M34 48l2 8"/><path d="M40 46l5 8"/></g>
        <ellipse cx="32" cy="38" rx="15" ry="12" fill="#262d52"/>
        <path d="M18.5 36q13.5 6 27 0" stroke="#4cc9f0" stroke-width="3" fill="none"/><path d="M21 42q11 5 22 0" stroke="#ffc145" stroke-width="2.6" fill="none"/>
        <g stroke="#2e3661" stroke-width="2" fill="none" stroke-linecap="round"><path d="M27 15q-2-7-7-9"/><path d="M37 15q2-7 7-9"/></g>
        <circle cx="20" cy="6" r="2.6" fill="#ff5d73"/><circle cx="44" cy="6" r="2.6" fill="#3ddc97"/>
        <circle cx="32" cy="25" r="12.5" fill="#2e3661"/>
        <circle cx="25.5" cy="23" r="6.6" fill="#fff"/><circle cx="38.5" cy="23" r="6.6" fill="#fff"/>
        <g class="pupils"><circle cx="25.5" cy="24" r="3.3" fill="#0d1022"/><circle cx="38.5" cy="24" r="3.3" fill="#0d1022"/><circle cx="26.7" cy="22.6" r="1.1" fill="#fff"/><circle cx="39.7" cy="22.6" r="1.1" fill="#fff"/></g>
        <ellipse class="lid" cx="25.5" cy="23" rx="6.9" ry="6.9" fill="#2e3661"/><ellipse class="lid" cx="38.5" cy="23" rx="6.9" ry="6.9" fill="#2e3661"/>
        <circle cx="21" cy="30" r="2" fill="#ff8fa3" opacity=".55"/><circle cx="43" cy="30" r="2" fill="#ff8fa3" opacity=".55"/>
        <path class="mouth" d="M29 31q3 2.6 6 0" stroke="#ff8fa3" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      </g></svg></div>
  <div class="word" id="word">KIPP<span>WERK</span></div>
  <div class="tag" id="tag"></div>
  <div class="cta" id="cta"></div>
  <div class="small" id="small"></div>
</div>

<div id="fade"></div>
<script>
const $=id=>document.getElementById(id);
const LANG=new URLSearchParams(location.search).get('lang')||'de';const T=(de,en)=>LANG==='en'?en:de;
$('tag').textContent=T('Kippen. Verbinden. Kettenreaktion.','Tilt. Connect. Chain reaction.');
$('cta').textContent=T('Jetzt kostenlos spielen','Play for free now');
$('small').textContent=T('Google Play · Tagesspiel · 100 Etappen · Endlos bis 10×10','Google Play · Daily game · 100 stages · Endless up to 10×10');
const COLS=['#ff5d73','#ffc145','#3ddc97','#4cc9f0','#b57bff'];
for(let i=0;i<10;i++){const d=document.createElement('div');d.className='deco';d.style.background=COLS[i%5];d.style.left=(60+i*181%1100)+'px';d.style.top=(40+i*263%960)+'px';d.style.animationDelay=(-i*1.7)+'s';$('decos').appendChild(d)}
const at=(ms,fn)=>setTimeout(fn,ms);
function cap(h,p,step){$('cap').classList.add('out');at(260,()=>{$('capH').innerHTML=h;$('capP').innerHTML=p;$('cap').classList.remove('out')});if(step!==undefined)$('step').textContent=step}
function fadeIn(){$('fade').classList.add('off')}
function fadeOut(d){at(d-260,()=>$('fade').classList.remove('off'))}
const G=()=>$('game').contentWindow,GD=()=>G().document,click=sel=>{const e=GD().querySelector(sel);if(e)e.click()};
const MOVES='LDDLLLDDDDDDDD';
const ARR={L:['180deg','-120px','0px'],R:['0deg','120px','0px'],U:['-90deg','0px','-120px'],D:['90deg','0px','120px']};
function swipe(d){const a=$('arrow'),r=ARR[d];a.style.setProperty('--dx',r[1]);a.style.setProperty('--dy',r[2]);a.style.rotate=r[0];
  a.classList.remove('go');void a.offsetWidth;a.classList.add('go');G().__kw.move(d)}
const TH=['std','werkstatt','pastell','retro','neon','ozean','papier','wald','lava','bonbon','gold','kristall','kosmos','prisma','winter','feuerwerk','fruehling'];
const KP=['none','brille','kopfhoerer','helm','zauberhut','schal','krone','partyhut','hasen'];
function loadGame(o={}){return new Promise(res=>{
  localStorage.clear();localStorage.setItem('kippwerk_helpseen','1');localStorage.setItem('kippwerk_seenver',new URLSearchParams(location.search).get('ver')||'9.9.9');
  localStorage.setItem('kippwerk_settings',JSON.stringify(Object.assign({lang:LANG,sfxVol:0,musicVol:0,vibe:'off',overtake:'off'},o.set||{})));localStorage.setItem('kippwerk_lives','2');
  localStorage.setItem('kippwerk_scores',JSON.stringify({endless:[{name:'Lena',score:23710,level:7,date:'09.11.26',size:6,pid:'x'}],daily:[]}));
  const d=new Date();const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  localStorage.setItem('kippwerk_streak',JSON.stringify({cur:13,best:13,last:k,shields:1,prot:[],adDay:null,ms:[3,7],seen:[3,7]}));
  const lp={};for(let i=1;i<=34;i++)lp[i]=i%4?3:2;localStorage.setItem('kippwerk_levels',JSON.stringify(lp));
  localStorage.setItem('kippwerk_unlocks',JSON.stringify(o.unl||['board:4','board:9','board:10','board:6h','board:7h','board:8h',...TH.map(t=>'theme:'+t),...KP.map(t=>'kippi:'+t)]));
  localStorage.setItem('kippwerk_coll_seen',JSON.stringify([...TH.map(t=>'theme:'+t),...KP.map(t=>'kippi:'+t),'board:4','board:9','board:10','board:6h','board:7h','board:8h']));
  localStorage.setItem('kippwerk_badges',JSON.stringify({funke:'2026-11-01',woche:'2026-11-07',zwei:'2026-11-10',welt1:'2026-11-05',sterne:'2026-11-08',profi:'2026-11-09',ultra:'2026-11-06',mini:'2026-11-09',fels6:'2026-11-10',weitblick:'2026-11-10',gross:'2026-11-10',stammgast:'2026-11-10'}));
  localStorage.setItem('kippwerk_maxlv',JSON.stringify({'4':22,'5':24,'6':41,'7':33,'8':42,'9':41,'10':12,'6h':31}));
  if(o.ls)o.ls();
  $('game').onload=()=>{try{GD().head.insertAdjacentHTML('beforeend','<style>.toast{display:none!important}</style>')}catch(e){}
    try{const n=GD().getElementById('newsOv');if(n&&!n.classList.contains('hidden'))GD().getElementById('newsClose').click()}catch(e){}res()};$('game').src='/kippwerk/www/index.html#seed='+(o.seed||29)})}
function runMoves(list,first,gap,sw){let i=0;const step=()=>{if(i>=list.length)return;const st=G().__kw.state;if(st.busy||st.over){setTimeout(step,30);return}
  const m=list[i++];sw?swipe(m):G().__kw.move(m);setTimeout(step,gap)};setTimeout(step,first)}
function show(){$('phone').style.opacity=1;fadeIn()}
const BOARD=(key,label,sub,seed,n)=>({d:3600,async prep(){await loadGame({set:{size:key},seed})},prepMs:n*260+1500,
  prepRun(){click('#endlessBtn');runMoves([...'LDRDLDRULDLDRDLURDLDRDLU'.repeat(3)].slice(0,n),300,240,false)},
  run(){show();cap(label,sub,T('Neue Felder','New boards'));runMoves([...'LDRU'],400,700,true);fadeOut(3600)}});
const SCENES={
  1:{d:4200,run(){fadeIn();$('full').classList.add('on');['cta','small'].forEach(x=>$(x).style.display='none');
     document.querySelectorAll('.lt').forEach((t,i)=>at(150+i*140,()=>t.classList.add('in')));at(750,()=>$('kfly').classList.add('in'));at(1000,()=>$('word').classList.add('on'));at(1500,()=>$('tag').classList.add('on'));fadeOut(4200)}},
  2:{d:7500,async prep(){await loadGame()},prepMs:3000,prepRun(){},run(){show();
     cap(T('Das neue<br><em>Hauptmenü</em>','The new<br><em>main menu</em>'),T('Top 5, Tagesspiel, Etappen und Endlos –<br>alles auf einen Blick','Top 5, daily game, stages and endless –<br>everything at a glance'),T('KIPPWERK 2.0','KIPPWERK 2.0'));
     at(300,()=>G().__kw.fly.visit());
     at(3600,()=>{click('#sizePick');cap(T('Dein <em>Feld</em><br>mit einem Tipp','Your <em>board</em><br>in one tap'),T('Von 4×4 bis 10×10 –<br>auch mit Hindernissen','From 4×4 to 10×10 –<br>also with obstacles'))});
     at(6400,()=>{try{G().document.body.click()}catch(e){}});fadeOut(7500)}},
  3:{d:10000,async prep(){await loadGame({set:{size:'6'}})},run(){click('#endlessBtn');show();
     cap(T('Wische – das ganze<br>Feld <em>kippt</em>','Swipe – the whole<br>board <em>tilts</em>'),T('Alle Steine rutschen mit','Every stone slides along'),T('So geht’s','How to play'));
     runMoves([...MOVES].slice(0,12),600,640,true);at(200,()=>G().__kw.fly.visit());
     at(3600,()=>cap(T('3 gleiche Farben<br><em>verschwinden</em>','Match 3 colors –<br>they <em>vanish</em>'),T('Größere Gruppen bringen mehr Punkte','Bigger groups, more points')));
     at(6800,()=>cap(T('Nachrutschen löst<br><em>Ketten</em> aus','Sliding stones trigger<br><em>chains</em>'),T('Bis zur MEGA-Combo','All the way to a MEGA combo')));fadeOut(10000)}},
  4:{d:5200,async prep(){await loadGame({set:{size:'6'}})},prepMs:12000,prepRun(){click('#endlessBtn');runMoves([...MOVES].slice(0,12),300,400,false)},
     run(){show();cap(T('GOOD · SUPER · MEGA<br>MONSTER · <em>ULTRA</em>','GOOD · SUPER · MEGA<br>MONSTER · <em>ULTRA</em>'),T('Große Combos bringen ❤ Extra-Leben','Big combos earn ❤ extra lives'),T('Combos','Combos'));
     at(300,()=>G().__kw.comboFx(2));at(1200,()=>G().__kw.comboFx(4));at(2200,()=>G().__kw.comboFx(5));at(3200,()=>G().__kw.comboFx(6));fadeOut(5200)}},
  5:{d:7500,async prep(){await loadGame({seed:3})},prepMs:18000,prepRun(){click('#dailyBtn');runMoves([...'LDLDRDLU'.repeat(5)].slice(0,34),300,150,false)},
     run(){show();cap(T('Jeden Tag ein neues<br><em>Tagesspiel</em>','A new <em>daily game</em><br>every day'),T('Gleiche Steine für alle –<br>40 Züge, ein Versuch','Same stones for everyone –<br>40 moves, one try'),T('Tagesspiel','Daily game'));
     runMoves([...'DRDLULDRDLDRDL'],300,300,true);
     at(4200,()=>{const n=GD().getElementById('nameRow');if(n)n.style.display='none';cap(T('Ergebnis <em>teilen</em><br>und vergleichen','<em>Share</em> and<br>compare'),T('Mit Serie 🔥 und Abzeichen','With streak 🔥 and badges'))});fadeOut(7500)}},
  6:{d:8000,async prep(){await loadGame()},prepMs:2500,prepRun(){},run(){show();
     click('#menuScores');at(150,()=>{click('#tabDaily');click('#periodTabs [data-p=day]')});
     cap(T('<em>Weltweite</em><br>Bestenlisten','<em>Worldwide</em><br>leaderboards'),T('Über Google Play Games – für jedes Feld','Via Google Play Games – for every board'),T('Wettbewerb','Compete'));
     at(2700,()=>click('#periodTabs [data-p=week]'));
     at(5000,()=>{click('#tabEndless');at(200,()=>click('#periodTabs [data-p=all]'));cap(T('Heute · Woche<br>· <em>Gesamt</em>','Today · week<br>· <em>all time</em>'),T('Und ein Hinweis, wenn dich<br>jemand überholt 🏁','Plus a notice when someone<br>overtakes you 🏁'))});fadeOut(8000)}},
  7:{d:6000,async prep(){await loadGame()},run(){show();click('#levelBtn');
     cap(T('<em>100 Etappen</em><br>in 10 Welten','<em>100 stages</em><br>in 10 worlds'),T('Ziele, Felsen, Bosse<br>und bis zu 3 Sterne','Goals, rocks, bosses<br>and up to 3 stars'),T('Etappen','Stages'));
     at(2600,()=>{const s=GD().getElementById('lvScroll');if(s)s.scrollTo({top:s.scrollTop+420,behavior:'smooth'})});fadeOut(6000)}},
  8:BOARD('4',T('<em>4×4</em> – der<br>schnelle Mini','<em>4×4</em> – the<br>quick mini'),T('Freigeschaltet ab Endlos 5×5 Level 15','Unlocks at Endless 5×5 level 15'),5,14),
  9:BOARD('9',T('<em>9×9</em> und<br>mehr Steine','<em>9×9</em> and<br>more stones'),T('Für Profis: ab Welt 7','For pros: from world 7'),7,10),
  10:BOARD('10',T('<em>10×10</em> – das<br>große Feld','<em>10×10</em> – the<br>big board'),T('6. Farbe, Felsen, riesige Combos','6th color, rocks, huge combos'),11,12),
  11:BOARD('8h',T('Felder mit<br><em>Hindernissen</em> 🪨','Boards with<br><em>obstacles</em> 🪨'),T('6×6, 7×7 und 8×8 – Felsen ab Zug 1','6×6, 7×7 and 8×8 – rocks from move 1'),9,10),
  12:{d:12000,async prep(){await loadGame()},prepMs:1500,prepRun(){},run(){show();G().__kw.openCollection('themes');
     cap(T('<em>17 Designs</em><br>zum Freischalten','<em>17 themes</em><br>to unlock'),T('Von Werkstatt bis Feuerwerk','From workshop to fireworks'),T('Sammlung','Collection'));
     ['neon','lava','winter','std'].forEach((t,i)=>{const t0=400+i*1000;at(t0,()=>click(`#collThemes [data-th="${t}"]`));if(i<3){at(t0+250,()=>click('#collClose'));at(t0+850,()=>G().__kw.openCollection('themes'))}});
     at(4500,()=>{click('#collTabs [data-t="kippi"]');cap(T('Outfits für<br><em>Kippi</em> 🪰','Outfits for<br><em>Kippi</em> 🪰'),T('Auch zu Silvester und Ostern','Including New Year’s Eve and Easter'))});
     ['krone','zauberhut','partyhut'].forEach((k,i)=>at(5000+i*700,()=>click(`#collKippi [data-kp="${k}"]`)));
     at(7400,()=>{click('#collTabs [data-t="badges"]');cap(T('<em>24 Abzeichen</em>','<em>24 badges</em>'),T('Auch als Erfolge in Google Play Spiele','Also as Google Play Games achievements'))});
     at(10000,()=>{click('#collTabs [data-t="boards"]');cap(T('Neue <em>Felder</em><br>freispielen','Unlock new<br><em>boards</em>'),T('Mit Fortschrittsbalken','With progress bars'))});fadeOut(12000)}},
  13:{d:4500,async prep(){await loadGame()},run(){show();click('#menuStreak');
     cap(T('Halte deine<br>🔥 <em>Serie</em>','Keep your<br>🔥 <em>streak</em>'),T('Belohnungen für Tage in Folge','Rewards for days in a row'),T('Jeden Tag','Every day'));fadeOut(4500)}},
  14:{d:5000,run(){$('phone').style.opacity=0;$('cap').classList.add('out');$('step').style.opacity=0;fadeIn();$('full').classList.add('on');$('tag').style.display='none';
     document.querySelectorAll('.lt').forEach((t,i)=>at(i*90,()=>t.classList.add('in')));at(300,()=>$('kfly').classList.add('in'));at(350,()=>$('word').classList.add('on'));at(800,()=>$('cta').classList.add('on'));at(1200,()=>$('small').classList.add('on'))}}
};
window.SCENES=SCENES;
</script></body></html>
